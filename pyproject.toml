[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "poolguard"
version = "0.1.0"
description = "Statistically rigorous patient-pool analysis for clinical ML models"
readme = "README.md"
license = "MIT"
requires-python = ">=3.10"
authors = [{ name = "Composer", email = "poolguard@example.com" }]
keywords = [
    "clinical-trials",
    "machine-learning",
    "population-shift",
    "transportability",
    "regulatory",
    "ALCOA",
]
classifiers = [
    "Development Status :: 4 - Beta",
    "Intended Audience :: Healthcare Industry",
    "Intended Audience :: Science/Research",
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Topic :: Scientific/Engineering :: Medical Science Apps.",
    "Typing :: Typed",
]
dependencies = [
    "numpy>=1.24",
    "pandas>=2.0",
    "scikit-learn>=1.3",
    "scipy>=1.11",
    "statsmodels>=0.14",
]

[project.optional-dependencies]
dev = [
    "matplotlib>=3.8",
    "mypy>=1.8",
    "pandas-stubs>=2.0",
    "pytest>=7.4",
    "pytest-cov>=4.1",
    "ruff>=0.3",
]

[project.urls]
Homepage = "https://github.com/poolguard/poolguard"
Documentation = "https://github.com/poolguard/poolguard#readme"
Repository = "https://github.com/poolguard/poolguard"
Issues = "https://github.com/poolguard/poolguard/issues"

[tool.hatch.build]
sources = ["src"]

[tool.hatch.build.targets.wheel]
packages = ["poolguard"]

[tool.hatch.build.targets.sdist]
include = [
    "/src",
    "/tests",
    "/examples",
    "/README.md",
    "/LICENSE",
]

[tool.ruff]
target-version = "py310"
line-length = 100
src = ["src", "tests"]

[tool.ruff.lint]
select = [
    "E",
    "W",
    "F",
    "I",
    "B",
    "UP",
    "SIM",
    "RUF",
    "D",
]
ignore = ["D100", "D104", "D105"]

[tool.ruff.lint.pydocstyle]
convention = "google"

[tool.ruff.lint.per-file-ignores]
"tests/**/*.py" = ["D103"]

[tool.ruff.lint.isort]
known-first-party = ["poolguard"]

[tool.ruff.format]
quote-style = "double"
indent-style = "space"

[tool.mypy]
python_version = "3.10"
strict = true
warn_unreachable = true
show_error_codes = true
packages = ["poolguard"]
mypy_path = "src"

[[tool.mypy.overrides]]
module = ["statsmodels.*", "sklearn.*", "scipy.*", "pandas", "pandas.*"]
ignore_missing_imports = true

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]
addopts = [
    "--strict-markers",
    "--strict-config",
    "--cov=poolguard",
    "--cov-report=term-missing",
    "--cov-fail-under=80",
]
filterwarnings = [
    "error::DeprecationWarning:poolguard.*",
]

[tool.coverage.run]
branch = true
source = ["poolguard"]
omit = ["*/__version__.py"]

[tool.coverage.report]
exclude_lines = [
    "pragma: no cover",
    "if TYPE_CHECKING:",
    "raise NotImplementedError",
]
